name: BK dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Sellbird runtime and development dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install -e ".[dev]"
          python -m pip install --upgrade "pytest>=9.0.3,<10" "pip-audit==2.10.1"
      - name: Audit installed environment
        run: pip-audit --local --format=json --output pip-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sellbird-pip-audit-python-${{ matrix.python-version }}
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 30
